name: Build IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Create Xcode Project
      run: |
        cd AppSelector
        
        # Create project directory structure
        mkdir -p AppSelector.xcodeproj
        
        # Create project.pbxproj
        cat > AppSelector.xcodeproj/project.pbxproj << 'PBXPROJ'
        // !$*UTF8*$!
        {
          archiveVersion = 1;
          classes = {};
          objectVersion = 56;
          objects = {
            /* Begin PBXBuildFile section */
            1A1A1A1A1A1A1A1A /* AppSelectorApp.swift in Sources */ = {isa = PBXBuildFile; fileRef = 2A2A2A2A2A2A2A2A; };
            1B1B1B1B1B1B1B1B /* ContentView.swift in Sources */ = {isa = PBXBuildFile; fileRef = 2B2B2B2B2B2B2B2B; };
            1C1C1C1C1C1C1C1C /* InstalledApp.swift in Sources */ = {isa = PBXBuildFile; fileRef = 2C2C2C2C2C2C2C2C; };
            1D1D1D1D1D1D1D1D /* InstalledAppsProvider.swift in Sources */ = {isa = PBXBuildFile; fileRef = 2D2D2D2D2D2D2D2D; };
            /* End PBXBuildFile section */

            /* Begin PBXFileReference section */
            2A2A2A2A2A2A2A2A /* AppSelectorApp.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = AppSelectorApp.swift; sourceTree = "<group>"; };
            2B2B2B2B2B2B2B2B /* ContentView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ContentView.swift; sourceTree = "<group>"; };
            2C2C2C2C2C2C2C2C /* InstalledApp.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = InstalledApp.swift; sourceTree = "<group>"; };
            2D2D2D2D2D2D2D2D /* InstalledAppsProvider.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = InstalledAppsProvider.swift; sourceTree = "<group>"; };
            3A3A3A3A3A3A3A3A /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
            4A4A4A4A4A4A4A4A /* AppSelector.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = AppSelector.app; sourceTree = BUILT_PRODUCTS_DIR; };
            /* End PBXFileReference section */

            /* Begin PBXFrameworksBuildPhase section */
            5A5A5A5A5A5A5A5A /* Frameworks */ = {
              isa = PBXFrameworksBuildPhase;
              buildActionMask = 2147483647;
              files = ();
              runOnlyForDeploymentPostprocessing = 0;
            };
            /* End PBXFrameworksBuildPhase section */

            /* Begin PBXGroup section */
            6A6A6A6A6A6A6A6A = {
              isa = PBXGroup;
              children = (
                7A7A7A7A7A7A7A7A /* Sources */,
                8A8A8A8A8A8A8A8A /* Products */,
              );
              sourceTree = "<group>";
            };
            7A7A7A7A7A7A7A7A /* Sources */ = {
              isa = PBXGroup;
              children = (
                9A9A9A9A9A9A9A9A /* AppSelector */,
              );
              path = Sources;
              sourceTree = "<group>";
            };
            8A8A8A8A8A8A8A8A /* Products */ = {
              isa = PBXGroup;
              children = (
                4A4A4A4A4A4A4A4A /* AppSelector.app */,
              );
              name = Products;
              sourceTree = "<group>";
            };
            9A9A9A9A9A9A9A9A /* AppSelector */ = {
              isa = PBXGroup;
              children = (
                2A2A2A2A2A2A2A2A /* AppSelectorApp.swift */,
                2B2B2B2B2B2B2B2B /* ContentView.swift */,
                2C2C2C2C2C2C2C2C /* InstalledApp.swift */,
                2D2D2D2D2D2D2D2D /* InstalledAppsProvider.swift */,
                3A3A3A3A3A3A3A3A /* Info.plist */,
              );
              path = AppSelector;
              sourceTree = "<group>";
            };
            /* End PBXGroup section */

            /* Begin PBXNativeTarget section */
            AA1AA1AA1AA1AA1A /* AppSelector */ = {
              isa = PBXNativeTarget;
              buildConfigurationList = BB1BB1BB1BB1BB1B;
              buildPhases = (
                CC1CC1CC1CC1CC1C /* Sources */,
                5A5A5A5A5A5A5A5A /* Frameworks */,
                DD1DD1DD1DD1DD1D /* Resources */,
              );
              buildRules = ();
              dependencies = ();
              name = AppSelector;
              productName = AppSelector;
              productReference = 4A4A4A4A4A4A4A4A /* AppSelector.app */;
              productType = "com.apple.product-type.application";
            };
            /* End PBXNativeTarget section */

            /* Begin PBXProject section */
            EE1EE1EE1EE1EE1E /* Project object */ = {
              isa = PBXProject;
              attributes = {
                BuildIndependentTargetsInParallel = 1;
                LastSwiftUpdateCheck = 1500;
                LastUpgradeCheck = 1500;
              };
              buildConfigurationList = FF1FF1FF1FF1FF1F;
              compatibilityVersion = "Xcode 14.0";
              developmentRegion = en;
              hasScannedForEncodings = 0;
              knownRegions = (en, Base);
              mainGroup = 6A6A6A6A6A6A6A6A;
              productRefGroup = 8A8A8A8A8A8A8A8A /* Products */;
              projectDirPath = "";
              projectRoot = "";
              targets = (
                AA1AA1AA1AA1AA1A /* AppSelector */,
              );
            };
            /* End PBXProject section */

            /* Begin PBXResourcesBuildPhase section */
            DD1DD1DD1DD1DD1D /* Resources */ = {
              isa = PBXResourcesBuildPhase;
              buildActionMask = 2147483647;
              files = ();
              runOnlyForDeploymentPostprocessing = 0;
            };
            /* End PBXResourcesBuildPhase section */

            /* Begin PBXSourcesBuildPhase section */
            CC1CC1CC1CC1CC1C /* Sources */ = {
              isa = PBXSourcesBuildPhase;
              buildActionMask = 2147483647;
              files = (
                1A1A1A1A1A1A1A1A /* AppSelectorApp.swift in Sources */,
                1B1B1B1B1B1B1B1B /* ContentView.swift in Sources */,
                1C1C1C1C1C1C1C1C /* InstalledApp.swift in Sources */,
                1D1D1D1D1D1D1D1D /* InstalledAppsProvider.swift in Sources */,
              );
              runOnlyForDeploymentPostprocessing = 0;
            };
            /* End PBXSourcesBuildPhase section */

            /* Begin XCBuildConfiguration section */
            111111111111111A /* Debug */ = {
              isa = XCBuildConfiguration;
              buildSettings = {
                ALWAYS_SEARCH_USER_PATHS = NO;
                CLANG_ANALYZER_NONNULL = YES;
                CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";
                CLANG_ENABLE_MODULES = YES;
                CLANG_ENABLE_OBJC_ARC = YES;
                CODE_SIGN_IDENTITY = "";
                CODE_SIGNING_ALLOWED = NO;
                COPY_PHASE_STRIP = NO;
                DEBUG_INFORMATION_FORMAT = dwarf;
                ENABLE_STRICT_OBJC_MSGSEND = YES;
                GCC_DYNAMIC_NO_PIC = NO;
                GCC_OPTIMIZATION_LEVEL = 0;
                GCC_WARN_UNINITIALIZED_AUTOS = YES_AGGRESSIVE;
                IPHONEOS_DEPLOYMENT_TARGET = 14.0;
                MTL_ENABLE_DEBUG_INFO = INCLUDE_SOURCE;
                ONLY_ACTIVE_ARCH = YES;
                SDKROOT = iphoneos;
                SWIFT_ACTIVE_COMPILATION_CONDITIONS = DEBUG;
                SWIFT_OPTIMIZATION_LEVEL = "-Onone";
              };
              name = Debug;
            };
            111111111111111B /* Release */ = {
              isa = XCBuildConfiguration;
              buildSettings = {
                ALWAYS_SEARCH_USER_PATHS = NO;
                CLANG_ANALYZER_NONNULL = YES;
                CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";
                CLANG_ENABLE_MODULES = YES;
                CLANG_ENABLE_OBJC_ARC = YES;
                CODE_SIGN_IDENTITY = "";
                CODE_SIGNING_ALLOWED = NO;
                COPY_PHASE_STRIP = NO;
                DEBUG_INFORMATION_FORMAT = "dwarf-with-dsym";
                ENABLE_NS_ASSERTIONS = NO;
                ENABLE_STRICT_OBJC_MSGSEND = YES;
                GCC_WARN_UNINITIALIZED_AUTOS = YES_AGGRESSIVE;
                IPHONEOS_DEPLOYMENT_TARGET = 14.0;
                MTL_ENABLE_DEBUG_INFO = NO;
                SDKROOT = iphoneos;
                SWIFT_COMPILATION_MODE = wholemodule;
                SWIFT_OPTIMIZATION_LEVEL = "-O";
                VALIDATE_PRODUCT = YES;
              };
              name = Release;
            };
            222222222222222A /* Debug */ = {
              isa = XCBuildConfiguration;
              buildSettings = {
                ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;
                CODE_SIGN_IDENTITY = "";
                CODE_SIGNING_ALLOWED = NO;
                CURRENT_PROJECT_VERSION = 1;
                GENERATE_INFOPLIST_FILE = NO;
                INFOPLIST_FILE = Sources/AppSelector/Info.plist;
                INFOPLIST_KEY_UIApplicationSceneManifest_Generation = YES;
                INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents = YES;
                INFOPLIST_KEY_UILaunchScreen_Generation = YES;
                INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad = "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight";
                INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone = "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight";
                LD_RUNPATH_SEARCH_PATHS = (
                  "$(inherited)",
                  "@executable_path/Frameworks",
                );
                MARKETING_VERSION = 1.0;
                PRODUCT_BUNDLE_IDENTIFIER = com.satella.appselector;
                PRODUCT_NAME = "$(TARGET_NAME)";
                SWIFT_EMIT_LOC_STRINGS = YES;
                SWIFT_VERSION = 5.0;
                TARGETED_DEVICE_FAMILY = "1,2";
              };
              name = Debug;
            };
            222222222222222B /* Release */ = {
              isa = XCBuildConfiguration;
              buildSettings = {
                ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;
                CODE_SIGN_IDENTITY = "";
                CODE_SIGNING_ALLOWED = NO;
                CURRENT_PROJECT_VERSION = 1;
                GENERATE_INFOPLIST_FILE = NO;
                INFOPLIST_FILE = Sources/AppSelector/Info.plist;
                INFOPLIST_KEY_UIApplicationSceneManifest_Generation = YES;
                INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents = YES;
                INFOPLIST_KEY_UILaunchScreen_Generation = YES;
                INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad = "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight";
                INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone = "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight";
                LD_RUNPATH_SEARCH_PATHS = (
                  "$(inherited)",
                  "@executable_path/Frameworks",
                );
                MARKETING_VERSION = 1.0;
                PRODUCT_BUNDLE_IDENTIFIER = com.satella.appselector;
                PRODUCT_NAME = "$(TARGET_NAME)";
                SWIFT_EMIT_LOC_STRINGS = YES;
                SWIFT_VERSION = 5.0;
                TARGETED_DEVICE_FAMILY = "1,2";
              };
              name = Release;
            };
            /* End XCBuildConfiguration section */

            /* Begin XCConfigurationList section */
            FF1FF1FF1FF1FF1F /* Build configuration list for PBXProject */ = {
              isa = XCConfigurationList;
              buildConfigurations = (
                111111111111111A /* Debug */,
                111111111111111B /* Release */,
              );
              defaultConfigurationIsVisible = 0;
              defaultConfigurationName = Release;
            };
            BB1BB1BB1BB1BB1B /* Build configuration list for PBXNativeTarget */ = {
              isa = XCConfigurationList;
              buildConfigurations = (
                222222222222222A /* Debug */,
                222222222222222B /* Release */,
              );
              defaultConfigurationIsVisible = 0;
              defaultConfigurationName = Release;
            };
            /* End XCConfigurationList section */
          };
          rootObject = EE1EE1EE1EE1EE1E /* Project object */;
        }
        PBXPROJ

    - name: Build App
      run: |
        cd AppSelector
        xcodebuild -project AppSelector.xcodeproj \
          -scheme AppSelector \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          SYMROOT="$(pwd)/build" \
          build

    - name: Create IPA
      run: |
        cd AppSelector
        echo "Build output contents:"
        find build -name "*.app" 2>/dev/null || echo "No .app found"
        ls -la build/Release-iphoneos/ 2>/dev/null || echo "Release-iphoneos not found"
        mkdir -p Payload
        cp -r build/Release-iphoneos/AppSelector.app Payload/
        zip -r AppSelector.ipa Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AppSelector-IPA
        path: AppSelector/AppSelector.ipa

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: AppSelector/AppSelector.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
