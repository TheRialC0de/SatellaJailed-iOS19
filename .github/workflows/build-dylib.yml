name: Build Theos Tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.5
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Fix SDK and Prepare Jinx Dependency
        run: |
          # 1. Înlocuim iPhoneOS19.0.sdk cu iPhoneOS16.5.sdk în Makefile-ul de configurare
          sed -i '' 's/iPhoneOS19\.0\.sdk/iPhoneOS16.5.sdk/g' Makefile

          # 2. Ștergem fișierele .swiftinterface problematice din SwiftUI pentru a evita crash-urile compilatorului
          echo "Cleaning up SwiftUI swiftinterface files..."
          find "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/SwiftUI.framework" -name "*.swiftinterface" -exec rm -f {} \;

          # 3. Descărcăm framework-ul Jinx din sursa oficială
          echo "Cloning Jinx framework..."
          git clone https://github.com /tmp/Jinx
          
          # 4. Creăm structura exactă pe care import Jinx o caută global în Theos
          mkdir -p "$THEOS/include/Jinx"
          cp -R /tmp/Jinx/Sources/Jinx/* "$THEOS/include/Jinx/"
          
          # 5. Menținem structurile locale în caz că scriptul patch-mac.sh depinde direct de ele
          mkdir -p SourcePackages/checkouts/Jinx
          cp -R /tmp/Jinx/* SourcePackages/checkouts/Jinx/
          
          sudo mkdir -p /SourcePackages/checkouts/Jinx
          sudo cp -R /tmp/Jinx/* /SourcePackages/checkouts/Jinx/ 2>/dev/null || true

          # 6. Rulăm scriptul de patch local dacă este prezent în proiect
          if [ -f "patch-mac.sh" ]; then
            echo "Running patch-mac.sh..."
            chmod +x patch-mac.sh
            ./patch-mac.sh
          fi

      - name: Build Tweak
        run: |
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tweak
          path: |
            packages/*.deb
            **/obj/*.dylib
            .theos/obj/*.dylib
