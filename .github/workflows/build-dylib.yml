name: Build Theos Tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.5
        with:
      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.5
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Install Jinx Framework
        run: |
          echo "Cloning and installing Jinx framework..."
          git clone --branch master https://github.com/Paisseon/Jinx.git /tmp/Jinx
          mkdir -p $THEOS/include/Jinx
          cp -R /tmp/Jinx/Sources/Jinx/* $THEOS/include/Jinx/

      - name: Fix Makefile and SDK
        run: |
          # 1. Заменяем iPhoneOS19.0.sdk на iPhoneOS16.5.sdk, который реально есть на сервере
          sed -i '' 's/iPhoneOS19\.0\.sdk/iPhoneOS16.5.sdk/g' Makefile

          # 2. Удаляем текстовые swiftinterface интерфейсы SwiftUI, чтобы новый компилятор не выдавал ошибки парсинга
          echo "Cleaning up SwiftUI swiftinterface files..."
          find "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/SwiftUI.framework" -name "*.swiftinterface" -exec rm -f {} \;

      - name: Build Tweak
        run: |
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tweak
          path: |
            packages/*.deb
            **/obj/*.dylib
            .theos/obj/*.dylib
