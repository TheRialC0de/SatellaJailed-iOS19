name: Build Theos Tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.5
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Clone Jinx as Subproject
        run: |
          echo "Cloning Jinx into project root..."
          git clone https://github.com/Paisseon/Jinx.git Jinx
          
          # Добавляем Jinx в SUBPROJECTS в корневом Makefile
          sed -i '' 's/SUBPROJECTS += Tweak/SUBPROJECTS += Jinx Tweak/g' Makefile

      - name: Fix SDK and Makefile
        run: |
          # 1. Заменяем iPhoneOS19.0.sdk на iPhoneOS16.5.sdk в Makefile
          sed -i '' 's/iPhoneOS19\.0\.sdk/iPhoneOS16.5.sdk/g' Makefile

          # 2. Удаляем проблемные текстовые интерфейсы SwiftUI, чтобы компилятор не падал на них
          echo "Cleaning up SwiftUI swiftinterface files..."
          find "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/SwiftUI.framework" -name "*.swiftinterface" -exec rm -f {} \;

      - name: Build Tweak
        run: |
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tweak
          path: |
            packages/*.deb
            **/obj/*.dylib
            .theos/obj/*.dylib
