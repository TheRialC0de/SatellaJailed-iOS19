name: Build Theos Tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.5
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Fix SDK for iOS 19
        run: |
          echo "Available SDKs:"
          ls -la $THEOS/sdks
          LATEST_SDK=$(ls $THEOS/sdks | grep "iPhoneOS" | tail -n 1)
          echo "Using $LATEST_SDK as base for iPhoneOS19.0.sdk"
          if [ ! -d "$THEOS/sdks/iPhoneOS19.0.sdk" ]; then
            cp -r "$THEOS/sdks/$LATEST_SDK" "$THEOS/sdks/iPhoneOS19.0.sdk"
          fi

      - name: Build Tweak
        run: |
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tweak
          path: |
            packages/*.deb
            obj/*.dylib
