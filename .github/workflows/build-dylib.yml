name: Build Theos Tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.5
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Install Jinx Framework
        run: |
          echo "Cloning Jinx framework into Theos include directory..."
          rm -rf $THEOS/include/Jinx
          git clone https://github.com/Paisseon/Jinx.git $THEOS/include/Jinx

      - name: Fix SDK and Makefile
        run: |
          # 1. Заменяем iPhoneOS19.0.sdk на реально доступный iPhoneOS16.5.sdk в Makefile
          sed -i '' 's/iPhoneOS19\.0\.sdk/iPhoneOS16.5.sdk/g' Makefile

          # 2. Переименовываем swiftinterface для SwiftUI, чтобы избежать ошибок парсинга новым компилятором
          SWIFTUI_INTERFACE="$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/SwiftUI.framework/Modules/SwiftUI.swiftmodule/arm64-apple-ios.swiftinterface"
          if [ -f "$SWIFTUI_INTERFACE" ]; then
            echo "Bypassing SwiftUI swiftinterface..."
            mv "$SWIFTUI_INTERFACE" "${SWIFTUI_INTERFACE}.bak"
          fi

      - name: Build Tweak
        run: |
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tweak
          path: |
            packages/*.deb
            **/obj/*.dylib
            .theos/obj/*.dylib
