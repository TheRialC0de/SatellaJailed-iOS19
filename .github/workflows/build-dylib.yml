name: Build Theos Tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: waruhachi/theos-action@v2.6.5
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Fix SDK and Prepare Jinx Dependency
        run: |
          # 1. Заменяем iPhoneOS19.0.sdk на iPhoneOS16.5.sdk в Makefile
          sed -i '' 's/iPhoneOS19\.0\.sdk/iPhoneOS16.5.sdk/g' Makefile

          # 2. Удаляем проблемные текстовые swiftinterface интерфейсы SwiftUI
          echo "Cleaning up SwiftUI swiftinterface files..."
          find "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/SwiftUI.framework" -name "*.swiftinterface" -exec rm -f {} \;

          # 3. Клонируем Jinx во все целевые директории, которые ожидает patch-mac.sh и Theos
          echo "Cloning and placing Jinx framework..."
          git clone https://github.com/Paisseon/Jinx.git /tmp/Jinx
          
          # Для Theos include
          mkdir -p $THEOS/include/Jinx
          cp -R /tmp/Jinx/Sources/Jinx/* $THEOS/include/Jinx/ 2>/dev/null || true
          
          # Для локального пути проекта, который ищет patch-mac.sh
          mkdir -p SourcePackages/checkouts/Jinx
          cp -R /tmp/Jinx/* SourcePackages/checkouts/Jinx/
          
          # На всякий случай создаем абсолютный системный путь
          sudo mkdir -p /SourcePackages/checkouts/Jinx
          sudo cp -R /tmp/Jinx/* /SourcePackages/checkouts/Jinx/ 2>/dev/null || true

          # 4. Запускаем штатный скрипт патча
          if [ -f "patch-mac.sh" ]; then
            echo "Running patch-mac.sh..."
            chmod +x patch-mac.sh
            ./patch-mac.sh
          fi

      - name: Build Tweak
        run: |
          make package

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-tweak
          path: |
            packages/*.deb
            **/obj/*.dylib
            .theos/obj/*.dylib
